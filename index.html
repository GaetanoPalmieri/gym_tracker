<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RecompApp">
<meta name="theme-color" content="#12181f">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231f4e5f'/%3E%3Ctext x='50' y='64' font-size='48' text-anchor='middle' fill='%23ffffff' font-family='Arial' font-weight='bold'%3ERC%3C/text%3E%3C/svg%3E">
<title>Ricomposizione — 8 Settimane</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#12181f; --card:#1b232c; --card2:#222d38; --accent:#2f9e8f; --accent2:#e8a33d;
    --text:#f1f5f4; --sub:#9fb0ab; --danger:#e5584f; --line:#2b3640;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    height:100%; }
  input, textarea{ -webkit-user-select:text; user-select:text; font-size:16px; }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:90px;
    padding-top:env(safe-area-inset-top); }

  header.top{ padding:14px 16px 8px; position:sticky; top:0; background:var(--bg); z-index:5; }
  header.top h1{ font-size:19px; margin:0 0 10px; font-weight:700; letter-spacing:.2px; }

  .seg{ display:flex; gap:6px; background:var(--card); border-radius:12px; padding:4px; }
  .seg button{ flex:1; padding:9px 0; border:none; background:transparent; color:var(--sub);
    font-size:14px; font-weight:600; border-radius:9px; transition:background .12s, color .12s; }
  .seg button.active{ background:var(--accent); color:#08201c; }
  .seg button:active{ transform:scale(0.96); }

  .weekgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .weekgrid button{ padding:10px 12px; border:1px solid var(--line); background:var(--card); color:var(--sub);
    font-size:13px; font-weight:600; border-radius:10px; }
  .weekgrid button.active{ background:var(--accent); color:#08201c; border-color:var(--accent); }
  .weekgrid button:active{ transform:scale(0.96); }

  .daytabs{ display:flex; gap:6px; margin-top:10px; overflow-x:auto; }
  .daytabs button{ flex:1 0 auto; white-space:nowrap; padding:10px 12px; border:1px solid var(--line);
    background:var(--card); color:var(--sub); border-radius:10px; font-size:13px; font-weight:600; }
  .daytabs button.active{ background:var(--accent2); color:#231600; border-color:var(--accent2); }
  .daytabs button:active{ transform:scale(0.96); }

  main{ padding:12px 16px 0; }
  .banner{ background:linear-gradient(135deg,#233b34,#1b232c); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:12px; font-size:13px; color:var(--sub); }
  .banner b{ color:var(--accent); }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .card.exercise-next{ padding:22px 18px; border:2px solid var(--accent); background:#24343c; }
  .exercise-next .exname{ font-size:20px; }
  .exercise-next .setbtn{ padding:15px 0; }
  .exercise-status{ font-size:12px; font-weight:700; color:var(--accent); margin-bottom:10px; }
  .card.exercise-complete{ opacity:.45; background:#111820; }
  .exercise-complete .exercise-status{ color:var(--sub); }
  .foodtabs{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); overflow:visible; }
  .foodtabs button{ grid-column:span 3; min-width:0; padding:10px 3px; font-size:12px; }
  .foodtabs button:nth-child(n+5){ grid-column:span 4; }
  .weightrow input{ min-width:0; }
  .exhead{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .exname{ font-size:16px; font-weight:700; line-height:1.25; }
  .exmeta{ font-size:12.5px; color:var(--sub); margin-top:3px; }
  .infobtn{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--card2); color:var(--accent2); font-weight:700; font-size:14px; }
  .infobtn:active{ transform:scale(0.9); background:#2b3844; }
  .notebtn{ flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--card2); color:var(--accent); font-weight:700; font-size:13px; position:relative; }
  .notebtn:active{ transform:scale(0.9); background:#2b3844; }
  .notebtn.has::after{ content:""; position:absolute; top:2px; right:2px; width:7px; height:7px;
    border-radius:50%; background:var(--accent2); }
  .btnrow{ display:flex; gap:6px; flex:0 0 auto; }

  .anim-box{ width:100%; height:140px; background:var(--card2); border-radius:12px; display:flex;
    align-items:center; justify-content:center; margin-bottom:10px; }
  .anim-box svg{ width:190px; height:120px; }
  .anim-caption{ font-size:11px; color:var(--sub); text-align:center; margin:-4px 0 14px; }

  .notearea{ width:100%; min-height:110px; background:var(--card2); border:1px solid var(--line);
    border-radius:10px; color:var(--text); padding:10px; font-size:15px; resize:vertical; }
  .note-preview{ margin-top:8px; font-size:12.5px; color:var(--accent2); background:#2a2410; border-radius:8px;
    padding:6px 10px; display:none; }
  .note-preview.show{ display:block; }

  .setsrow{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .setbtn{ flex:1 1 auto; min-width:52px; padding:10px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:700; }
  .setbtn.done{ background:var(--accent); color:#08201c; border-color:var(--accent); }
  .setbtn:active{ transform:scale(0.93); }

  .weightrow{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .weightrow label{ font-size:12.5px; color:var(--sub); flex:0 0 auto; }
  .weightrow input{ flex:1; background:var(--card2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:8px 10px; font-size:15px; }
  .weightrow .prev{ font-size:11.5px; color:var(--sub); flex:0 0 auto; }

  .deload{ display:inline-block; margin-top:8px; font-size:11px; padding:3px 8px; border-radius:6px;
    background:#3a2a12; color:var(--accent2); font-weight:700; }

  nav.bottom{ position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding-bottom:env(safe-area-inset-bottom); max-width:520px; margin:0 auto; }
  nav.bottom button{ flex:1; background:none; border:none; color:var(--sub); padding:12px 0 8px;
    font-size:12px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav.bottom button.active{ color:var(--accent); }
  nav.bottom .ic{ font-size:19px; }

  /* Modal info */
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:50; }
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--card); width:100%; max-width:520px; margin:0 auto; border-radius:18px 18px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:75vh; overflow-y:auto; }
  .modal h2{ margin:0 0 10px; font-size:18px; }
  .modal p{ font-size:14.5px; color:#dbe6e2; line-height:1.5; }
  .modal .close{ display:block; width:100%; margin-top:14px; padding:12px; border-radius:10px; border:none;
    background:var(--accent); color:#08201c; font-weight:700; font-size:15px; }

  /* Timer overlay */
  .timer-bg{ position:fixed; inset:0; background:#0c1116ee; display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:60; }
  .timer-bg.show{ display:flex; }
  .timer-label{ color:var(--sub); font-size:14px; letter-spacing:.5px; text-transform:uppercase; margin-bottom:6px; }
  .timer-num{ font-size:88px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent); }
  .timer-sub{ color:var(--sub); font-size:14px; margin-top:6px; }
  .timer-actions{ display:flex; gap:12px; margin-top:34px; }
  .timer-actions button{ padding:14px 20px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:700; }
  .timer-actions button.skip{ background:var(--accent); color:#08201c; border-color:var(--accent); }
  .timer-actions button:active{ transform:scale(0.94); }

  /* Nutrition */
  .mealcard{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    display:flex; gap:12px; align-items:flex-start; }
  .mealicon{ flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:var(--card2);
    display:flex; align-items:center; justify-content:center; font-size:19px; }
  .mealbody{ flex:1; min-width:0; }
  .mealtime{ font-size:12px; color:var(--accent2); font-weight:700; }
  .mealtxt{ font-size:14px; margin-top:3px; line-height:1.4; }
  .mealmacros{ display:flex; gap:8px; margin-top:8px; font-size:11px; color:var(--sub); flex-wrap:wrap; }
  .mealmacros .pill{ background:var(--card2); border-radius:6px; padding:2px 7px; }
  .mealmacros .pill b{ color:var(--text); }
  .tot{ text-align:center; font-size:12.5px; color:var(--sub); margin:6px 0 16px; }

  .suppcard{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;
    display:flex; gap:12px; align-items:flex-start; }
  .suppicon{ flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:#23392f;
    display:flex; align-items:center; justify-content:center; font-size:19px; }
  .supptitle{ font-size:14.5px; font-weight:700; }
  .supptxt{ font-size:13px; color:#cfe0da; margin-top:3px; line-height:1.4; }
  .sectiontitle{ font-size:16px; font-weight:700; margin:18px 0 10px; color:var(--accent2); }
  .warn-box{ font-size:12px; color:#e5a89f; background:#3a2420; border-radius:10px; padding:10px 12px; margin-top:6px; }

  #launch-screen{ position:fixed; inset:0; z-index:10000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; background:radial-gradient(ellipse at 50% 40%,#203c3e 0%,#12181f 65%);
    opacity:1; transition:opacity .4s ease,visibility .4s; }
  #launch-screen[hidden]{ display:none; }
  #launch-screen.leaving{ opacity:0; visibility:hidden; pointer-events:none; }
  .launch-logo{ width:88px; height:88px; display:grid; place-items:center; border-radius:26px;
    background:linear-gradient(135deg,#2f9e8f,#1f4e5f); color:#fff; font-size:32px; font-weight:800;
    box-shadow:0 12px 45px #2f9e8f30; animation:launch-arrive .6s ease-out both; }
  .launch-title{ margin:0; font-size:27px; font-weight:750; letter-spacing:-.5px; }
  .launch-caption{ margin:0; color:var(--sub); font-size:14px; }
  .launch-spinner{ width:28px; height:28px; margin-top:12px; border:3px solid #2b3640;
    border-top-color:var(--accent2); border-radius:50%; animation:launch-spin .8s linear infinite; }
  body.launching{ overflow:hidden; }
  body.launching #app{ opacity:0; }
  #app{ transition:opacity .4s ease; }
  @keyframes launch-spin{ to{ transform:rotate(360deg); } }
  @keyframes launch-arrive{ from{ opacity:0; transform:translateY(12px) scale(.9); } to{ opacity:1; transform:none; } }
  @media(prefers-reduced-motion:reduce){
    .launch-logo,.launch-spinner{ animation:none; }
    #launch-screen,#app{ transition:none; }
  }

.session-clock{font-size:32px;font-weight:750;font-variant-numeric:tabular-nums;margin:10px 0;color:var(--accent2)}
.session-actions{display:flex;gap:8px;flex-wrap:wrap}.session-actions button,.skip-exercise{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:9px;padding:10px 14px}
.skip-exercise{margin-top:12px;color:var(--accent2)}
#stats-exercise,#stats-metric{width:100%;margin:10px 0;padding:12px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:14px}
.history-chart{width:100%;height:auto;margin:12px 0}.chart-empty{height:190px;display:grid;place-items:center;color:var(--sub);text-align:center;border-bottom:1px solid var(--line)}

.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
header.top .title-row h1{font-size:26px;line-height:1.2;margin:0;padding-top:3px;min-width:0}
#header-session{flex:0 0 auto;text-align:right}
#header-session:empty{display:none}
.session-panel{padding:0;margin:0;background:none;border:0}
.session-panel .exmeta{font-size:10px;margin:0}
.session-panel .session-clock{font-size:24px;line-height:1.2;margin:2px 0 6px}
.session-panel .session-actions{gap:4px;justify-content:flex-end;flex-wrap:nowrap}
.session-panel .session-actions button{font-size:10px;padding:7px 6px;border-radius:7px;white-space:nowrap}
.exercise-topline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.exercise-topline .exercise-status{margin:0}
.exercise-topline .skip-exercise{margin:0 0 0 auto;padding:7px 9px;font-size:11px;white-space:nowrap;flex-shrink:0}
@media(max-width:360px){header.top .title-row h1{font-size:22px}.session-panel .session-clock{font-size:21px}.session-panel .session-actions button{font-size:9px;padding:7px 5px}}
</style>
</head>
<body>
<div id="launch-screen" role="status" aria-live="polite" aria-label="Caricamento RecompApp" hidden>
  <div class="launch-logo" aria-hidden="true">RC</div>
  <p class="launch-title">RecompApp</p>
  <p class="launch-caption">Allenamento e nutrizione</p>
  <div class="launch-spinner" aria-hidden="true"></div>
  <p class="launch-caption">Caricamento…</p>
</div>
<script>
(function(){
  const screen = document.getElementById('launch-screen');
  const started = Date.now();
  let closing = false;
  screen.hidden = false;
  document.body.classList.add('launching');
  window.finishLaunch = function(immediate){
    if(closing) return;
    closing = true;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(()=>{
      document.body.classList.remove('launching');
      screen.classList.add('leaving');
      setTimeout(()=>screen.remove(),reduced ? 0 : 450);
    },immediate || reduced ? 0 : Math.max(0,1100-(Date.now()-started)));
  };
  // Never leave the launch overlay blocking the interface after an initialization error.
  setTimeout(()=>window.finishLaunch(true),4000);
  window.addEventListener('pageshow',event=>{ if(event.persisted) window.finishLaunch(true); });
})();
</script>
<div id="app">
  <header class="top">
    <div class="title-row"><h1 id="pagetitle">Allenamento</h1><div id="header-session"></div></div>
    <div id="weekbar" class="seg"></div>
    <div id="daybar" class="daytabs"></div>
  </header>
  <main id="main"></main>
</div>

<nav class="bottom">
  <button id="navWorkout" class="active"><span class="ic">🏋️</span>Allenamento</button>
  <button id="navFood"><span class="ic">🍽️</span>Nutrizione</button>
  <button id="navStats"><span class="ic">📊</span>Statistiche</button>
</nav>

<div class="modal-bg" id="infoBg">
  <div class="modal">
    <h2 id="infoTitle">Esercizio</h2>
    <div class="anim-box" id="infoAnim"></div>
    <div class="anim-caption">Animazione schematica della traiettoria di movimento (illustrativa, non un video reale dell'esercizio)</div>
    <p id="infoBody"></p>
    <button class="close" id="infoClose">Chiudi</button>
  </div>
</div>

<div class="modal-bg" id="noteBg">
  <div class="modal">
    <h2 id="noteTitle">Note esercizio</h2>
    <p style="font-size:12.5px;color:var(--sub);margin-top:-4px;">Queste note restano salvate su questo esercizio anche nelle settimane successive.</p>
    <textarea class="notearea" id="noteArea" placeholder="Es: usato 40kg, sentito bene la scapola, provare 42.5kg la prossima volta..."></textarea>
    <button class="close" id="noteSave">Salva nota</button>
  </div>
</div>

<div class="timer-bg" id="timerBg">
  <div class="timer-label">Recupero</div>
  <div class="timer-num" id="timerNum">90</div>
  <div class="timer-sub" id="timerSub"></div>
  <div class="timer-actions">
    <button id="timerMinus">-15s</button>
    <button id="timerSkip" class="skip">Salta</button>
    <button id="timerPlus">+15s</button>
  </div>
</div>

<script>
/* ===================== DATI PROGRAMMA ===================== */
const COMMON_CLOSING = [
  {name:"Crunch a terra (o ai cavi)", sets:3, reps:"20", rest:45, move:"core",
    note:"Addominali: contrai bene in alto, non tirare il collo con le mani, movimento lento e controllato."},
  {name:"Sollevamento gambe da sdraiato (leg raise)", sets:3, reps:"15", rest:45, move:"core",
    note:"Addominali bassi: schiena aderente al pavimento, gambe quasi tese, scendi senza toccare terra."},
  {name:"Tapis roulant — camminata in pendenza", sets:1, reps:"20-25 min", rest:0, move:"cardio",
    note:"Cardio a ritmo moderato (zona 2: un po' affannoso ma riesci a parlare). Aiuta il deficit calorico per far uscire gli addominali — ricorda che il grasso sulla pancia si riduce con le calorie, gli addominali servono a rinforzare e definire, non esiste il dimagrimento localizzato."},
  {name:"Esercizi di Kegel (pavimento pelvico)", sets:3, reps:"10 contrazioni (5\" tieni + 5\" rilascia)", rest:30, move:"kegel",
    note:"Contrai i muscoli che usi per fermare il flusso di urina, tieni 5 secondi, rilascia 5 secondi. Rinforzano il controllo del pavimento pelvico e nel tempo possono aiutare a ritardare l'eiaculazione."},
];

const DAYS = [
  { key:"d1", name:"Push", short:"G1 · Push",
    exercises:[
      {name:"Panca piana con bilanciere", sets:4, reps:"8", rest:120, compound:true, move:"vertical_press",
        note:"Scapole retratte e addotte, piedi ben piantati. Discesa controllata in 2-3 secondi, barra a metà petto, spinta esplosiva in alto senza staccare i glutei dalla panca."},
      {name:"Panca inclinata con manubri (30°)", sets:3, reps:"10", rest:90, move:"vertical_press",
        note:"Range di movimento completo. Evita di far \"sbattere\" i manubri in alto: mantieni un minimo di tensione e controllo in ogni ripetizione."},
      {name:"Lento avanti con manubri, seduto", sets:4, reps:"10", rest:90, move:"vertical_press",
        note:"Core stabile, non iperestendere la zona lombare. I manubri partono all'altezza delle spalle e salgono fino quasi a toccarsi in alto."},
      {name:"Alzate laterali con manubri", sets:4, reps:"15", rest:60, move:"lateral_raise",
        note:"Punto debole - deltoidi: gomito leggermente flesso, salita fino all'altezza della spalla, nessuno slancio con il busto. Se serve, riduci il peso per fare tutte le ripetizioni in modo pulito."},
      {name:"Croci ai cavi (cable fly)", sets:3, reps:"12", rest:60, move:"fly",
        note:"Tensione continua su tutto il movimento, breve pausa in massima contrazione al centro."},
      {name:"Push down tricipiti ai cavi", sets:3, reps:"12", rest:60, move:"vertical_press",
        note:"Gomiti fissi lungo il fianco: si muove solo l'avambraccio. Estensione completa in basso."},
      {name:"French press con manubrio", sets:3, reps:"10", rest:60, move:"vertical_press",
        note:"Gomiti stretti e fermi, scendi dietro la testa senza aprire i gomiti verso l'esterno."},
      ...COMMON_CLOSING,
    ]},
  { key:"d2", name:"Pull", short:"G2 · Pull",
    exercises:[
      {name:"Stacco rumeno con bilanciere", sets:4, reps:"8", rest:120, compound:true, move:"hinge",
        note:"Schiena neutra per tutto il movimento, bilanciere vicino alle gambe, spinta finale con i glutei. Fermati quando senti un buon allungamento dei femorali."},
      {name:"Lat machine presa larga", sets:4, reps:"10", rest:90, move:"vertical_pull",
        note:"Tira verso i capezzoli, petto in fuori, nessuno slancio con il busto. Controlla anche la fase di risalita."},
      {name:"Rematore con manubrio monolaterale", sets:3, reps:"10", rest:90, move:"horizontal_pull",
        note:"Un braccio per volta, busto quasi parallelo al pavimento, il gomito va verso l'anca, non verso l'alto."},
      {name:"Pulley basso (seated row)", sets:3, reps:"12", rest:90, move:"horizontal_pull",
        note:"Petto alto, tira verso l'ombelico, controlla sempre il ritorno senza far \"cadere\" il peso."},
      {name:"Face pull ai cavi", sets:3, reps:"15", rest:60, move:"lateral_raise",
        note:"Punto debole - deltoide posteriore: tira verso il viso con i gomiti alti. Ottimo anche per la postura delle spalle."},
      {name:"Curl bicipiti con bilanciere", sets:4, reps:"10", rest:60, move:"curl",
        note:"Gomiti fermi lungo il fianco, nessuno slancio con la schiena. Contrai bene in alto."},
      {name:"Curl a martello con manubri", sets:3, reps:"12", rest:60, move:"curl",
        note:"Presa neutra (palmi rivolti verso il corpo): lavora anche il brachiale, utile per braccia più \"piene\"."},
      ...COMMON_CLOSING,
    ]},
  { key:"d3", name:"Legs", short:"G3 · Legs",
    exercises:[

/* ===================== STATO ===================== */
let state = { week: 1, dayIdx: 0, tab: "workout" };
try { const saved = JSON.parse(localStorage.getItem("rc_state")); if (saved) state = {...state, ...saved}; } catch(e){}

function saveState(){ localStorage.setItem("rc_state", JSON.stringify(state)); }

function checkedKey(){ return `rc_checked_w${state.week}_${DAYS[state.dayIdx].key}`; }
function getChecked(){ try { return JSON.parse(localStorage.getItem(checkedKey())) || {}; } catch(e){ return {}; } }
function setChecked(obj){ localStorage.setItem(checkedKey(), JSON.stringify(obj)); }

function weightKey(exIdx){ return `rc_weight_w${state.week}_${DAYS[state.dayIdx].key}_e${exIdx}`; }
function prevWeightKey(exIdx){ return state.week > 1 ? `rc_weight_w${state.week-1}_${DAYS[state.dayIdx].key}_e${exIdx}` : null; }

// Le note sono persistenti per esercizio: NON dipendono dalla settimana
function noteKey(exIdx){ return `rc_note_${DAYS[state.dayIdx].key}_e${exIdx}`; }
function getNote(exIdx){ return localStorage.getItem(noteKey(exIdx)) || ""; }
function setNote(exIdx, txt){ if(txt && txt.trim()) localStorage.setItem(noteKey(exIdx), txt); else localStorage.removeItem(noteKey(exIdx)); }

function renderTopBars(){
  weekbar.innerHTML = "";

  }
  daybar.innerHTML = "";
  if(state.tab === "workout"){
    daybar.style.display = "flex";
    DAYS.forEach((d,i)=>{
      const b = document.createElement("button");

/* Sessioni e storico persistenti */
function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback;}catch(e){return fallback;}}
let sessions=readJSON('rc_sessions_v1',[]);
function persistSessions(){localStorage.setItem('rc_sessions_v1',JSON.stringify(sessions));}
function contextKey(){return `${state.week}_${DAYS[state.dayIdx].key}`;}
function skippedKey(){return `rc_skipped_${contextKey()}`;}
function getSkipped(){return readJSON(skippedKey(),{});}
function effectiveSets(ex,week=state.week){return ex.sets-(week%4===0&&ex.compound&&ex.sets>1?1:0);}
function snapshot(){const checked=getChecked(),skipped=getSkipped();return DAYS[state.dayIdx].exercises.map((ex,i)=>{
 const total=effectiveSets(ex),done=Array.from({length:total},(_,j)=>!!checked[`e${i}_s${j}`]).filter(Boolean).length;
 const raw=localStorage.getItem(weightKey(i));return {name:ex.name,total,done,weight:raw!==null&&raw!==''&&Number.isFinite(Number(raw))?Number(raw):null,reps:ex.reps,note:getNote(i),skipped:!!skipped[i]};
});}
function activeSession(){return sessions.find(s=>s.context===contextKey()&&!s.ended&&!s.legacy);}
function elapsed(s){return s? s.elapsed+(s.runningSince?Date.now()-s.runningSince:0):0;}
function timeLabel(ms){const n=Math.floor(ms/1000);return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(v=>String(v).padStart(2,'0')).join(':');}
function ensureSession(){let s=activeSession();if(s)return s;
 // Una sola sessione in corso conta il tempo; le altre rimangono in pausa.
 sessions.filter(x=>x.runningSince).forEach(x=>{x.elapsed=elapsed(x);x.runningSince=null;});
 const previous=sessions.some(x=>x.context===contextKey()&&x.ended&&!x.legacy);
 if(previous){setChecked({});localStorage.removeItem(skippedKey());}
 s={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),context:contextKey(),week:state.week,day:DAYS[state.dayIdx].short,started:new Date().toISOString(),ended:null,elapsed:0,runningSince:Date.now(),exercises:snapshot()};sessions.push(s);persistSessions();return s;
}
function syncSession(){const s=activeSession();if(s){s.exercises=snapshot();persistSessions();}}
function sessionPanel(){const s=activeSession();return `<div class="card session-panel"><div class="exmeta">Tempo totale sessione${s&&!s.runningSince?' · In pausa':''}</div><div id="session-clock" class="session-clock">${timeLabel(elapsed(s))}</div><div class="session-actions"><button id="session-toggle">${!s?'Avvia sessione':s.runningSince?'Pausa':'Riprendi'}</button>${s?'<button id="session-end">Termina sessione</button>':''}</div></div>`;}
function bindSession(){document.getElementById('session-toggle').onclick=()=>{let s=activeSession();if(!s)ensureSession();else if(s.runningSince){s.elapsed=elapsed(s);s.runningSince=null;persistSessions();}else{sessions.filter(x=>x.runningSince).forEach(x=>{x.elapsed=elapsed(x);x.runningSince=null;});s.runningSince=Date.now();persistSessions();}renderWorkout();};
 const end=document.getElementById('session-end');if(end)end.onclick=()=>{const s=activeSession();if(!s)return;syncSession();s.elapsed=elapsed(s);s.runningSince=null;s.ended=new Date().toISOString();persistSessions();closeTimer();renderWorkout();};}
setInterval(()=>{const el=document.getElementById('session-clock');if(el)el.textContent=timeLabel(elapsed(activeSession()));},1000);
function importLegacy(){if(localStorage.getItem('rc_history_imported'))return;
 for(let w=1;w<=8;w++)DAYS.forEach(day=>{const checked=readJSON(`rc_checked_w${w}_${day.key}`,{});const skipped=readJSON(`rc_skipped_${w}_${day.key}`,{});
 const exercises=day.exercises.map((ex,i)=>{const raw=localStorage.getItem(`rc_weight_w${w}_${day.key}_e${i}`);const total=effectiveSets(ex,w);return {name:ex.name,total,done:Array.from({length:total},(_,j)=>!!checked[`e${i}_s${j}`]).filter(Boolean).length,weight:raw!==null&&raw!==''&&Number.isFinite(Number(raw))?Number(raw):null,reps:ex.reps,skipped:!!skipped[i],note:localStorage.getItem(`rc_note_${day.key}_e${i}`)||''};});
 if(exercises.some(e=>e.done||e.weight!==null||e.skipped))sessions.push({id:`legacy-${w}-${day.key}`,context:`${w}_${day.key}`,week:w,day:day.short,legacy:true,elapsed:0,exercises});});persistSessions();localStorage.setItem('rc_history_imported','1');}
importLegacy();
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lineChart(rows,metric){const points=rows.filter(r=>!r.e.skipped&&r.e.done>0&&(metric!=='weight'||r.e.weight!==null)&&!r.s.legacy);if(!points.length)return '<div class="chart-empty">Nessun dato registrato per questo grafico.</div>';
 const max=Math.max(1,...points.map(r=>r.e[metric]));const coords=points.map((r,i)=>({x:points.length===1?180:45+i*280/(points.length-1),y:145-r.e[metric]/max*115,r}));
 return `<svg class="history-chart" viewBox="0 0 360 185" role="img" aria-label="${metric==='weight'?'Carico in kg':'Serie svolte'} nel tempo"><path d="M45 20V145H335" fill="none" stroke="#52616c"/><text x="3" y="30" fill="#9fb0ab" font-size="12">${Math.round(max*10)/10}</text><text x="22" y="149" fill="#9fb0ab" font-size="12">0</text><polyline points="${coords.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="#2f9e8f" stroke-width="3"/>${coords.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#e8a33d"><title>${escapeHTML(new Date(p.r.s.started).toLocaleString('it-IT'))}: ${p.r.e[metric]}</title></circle>`).join('')}<text x="45" y="175" fill="#9fb0ab" font-size="11">${new Date(points[0].s.started).toLocaleDateString('it-IT')}</text><text x="335" y="175" text-anchor="end" fill="#9fb0ab" font-size="11">${points.length>1?new Date(points.at(-1).s.started).toLocaleDateString('it-IT'):''}</text></svg>`;}
function renderStats(){document.getElementById("header-session").innerHTML="";pagetitle.textContent='Statistiche';const names=[...new Set(DAYS.flatMap(d=>d.exercises.map(e=>e.name)))];const selected=names.includes(state.statsExercise)?state.statsExercise:names[0];const metric=state.statsMetric==='done'?'done':'weight';
 const rows=sessions.flatMap(s=>s.exercises.filter(e=>e.name===selected&&(e.done||e.skipped||e.weight!==null)).map(e=>({s,e}))).sort((a,b)=>(a.s.started||'').localeCompare(b.s.started||''));
 let html=`<div class="card"><label for="stats-exercise">Esercizio</label><select id="stats-exercise">${names.map(n=>`<option ${n===selected?'selected':''}>${escapeHTML(n)}</option>`).join('')}</select><select id="stats-metric" aria-label="Misura del grafico"><option value="weight" ${metric==='weight'?'selected':''}>Carico (kg)</option><option value="done" ${metric==='done'?'selected':''}>Serie svolte</option></select>${lineChart(rows,metric)}<div class="exmeta">Grafico delle sessioni registrate. Gli esercizi saltati e i dati precedenti senza data sono esclusi.</div></div><div class="sectiontitle">Storico esercizio</div>`;
 html+=rows.length?rows.slice().reverse().map(({s,e})=>`<div class="card"><b>${s.legacy?'Dati precedenti · data non disponibile':new Date(s.started).toLocaleString('it-IT')}</b><div class="exmeta">Sett. ${s.week} · ${escapeHTML(s.day)}${s.legacy?'':` · ${s.ended?'Terminata':'In corso'} · ${timeLabel(elapsed(s))}`}</div><p>${e.skipped?'Non Effettuato':e.done===e.total?'Completato':e.done?'Parziale':'Carico annotato'}</p><div>${e.weight===null?'Carico non indicato':e.weight+' kg'} · ${e.done}/${e.total} serie svolte · ${escapeHTML(e.reps)} rip.</div>${e.note?`<div class="exmeta">${escapeHTML(e.note)}</div>`:''}</div>`).join(''):'<div class="card">Nessuno storico per questo esercizio. Avvia una sessione e registra le serie.</div>';
 html+='<div class="sectiontitle">Sessioni di allenamento</div>'+sessions.filter(s=>!s.legacy).slice().reverse().map(s=>`<div class="card"><b>${escapeHTML(s.day)} · Sett. ${s.week}</b><div class="exmeta">${new Date(s.started).toLocaleString('it-IT')}</div><p>${timeLabel(elapsed(s))} · ${s.ended?'Terminata':s.runningSince?'In corso':'In pausa'}</p><div class="exmeta">${s.exercises.filter(e=>!e.skipped&&e.done===e.total).length} completati · ${s.exercises.filter(e=>e.skipped).length} non effettuati</div></div>`).join('');
 html+='<p class="exmeta">Dati salvati su questo dispositivo e browser.</p>';main.innerHTML=html;
 document.getElementById('stats-exercise').onchange=e=>{state.statsExercise=e.target.value;saveState();renderStats();};document.getElementById('stats-metric').onchange=e=>{state.statsMetric=e.target.value;saveState();renderStats();};}

/* ===================== RENDER MAIN ===================== */
const main = document.getElementById("main");

function renderWorkout(){
  pagetitle.textContent = "Allenamento";
  const day = DAYS[state.dayIdx];
  const checked = getChecked();
  document.getElementById("header-session").innerHTML = sessionPanel();
  let html = "";
  const skipped = getSkipped();
  const ordered = day.exercises.map((ex, exIdx)=>{
    const count = ex.sets - (state.week%4===0 && ex.compound && ex.sets>1 ? 1 : 0);
    const complete = !!skipped[exIdx] || Array.from({length:count}, (_,s)=>!!checked[`e${exIdx}_s${s}`]).every(Boolean);
    return {ex, exIdx, complete};
  }).sort((a,b)=>Number(a.complete)-Number(b.complete) || a.exIdx-b.exIdx);
  const nextIdx = ordered.find(item=>!item.complete)?.exIdx;

  ordered.forEach(({ex, exIdx, complete})=>{
    let sets = ex.sets;
    let deloadTag = "";
    if(state.week%4===0 && ex.compound && sets>1){ sets = sets-1; deloadTag = `<span class="deload">Deload: -1 serie / -10% carico</span>`; }
    let setBtns = "";
    for(let s=0; s<sets; s++){
      const k = `e${exIdx}_s${s}`;
      const isDone = !!checked[k];
      setBtns += `<button class="setbtn ${isDone?'done':''}" data-ex="${exIdx}" data-set="${s}" data-rest="${ex.rest}">Serie ${s+1}</button>`;
    }
    const pkey = prevWeightKey(exIdx);
    let prevVal = "";
    if(pkey){ const v = localStorage.getItem(pkey); if(v) prevVal = `Sett. prec.: ${v}kg`; }
    const curVal = localStorage.getItem(weightKey(exIdx)) || "";
    const hasNote = !!getNote(exIdx);

    html += `<div class="card ${complete?'exercise-complete':exIdx===nextIdx?'exercise-next':''}" data-exercise="${exIdx}">
      <div class="exercise-topline">
      ${skipped[exIdx]?'<div class="exercise-status">Non Effettuato</div>':complete?'<div class="exercise-status">✓ Completato</div>':exIdx===nextIdx?'<div class="exercise-status">Prossimo esercizio</div>':''}
      <button class="skip-exercise" data-skip-ex="${exIdx}">${skipped[exIdx]?'Ripristina esercizio':'Salta esercizio'}</button>
      </div>
      <div class="exhead">
        <div>
          <div class="exname">${ex.name}</div>
          <div class="exmeta">${sets} serie × ${ex.reps} rip. · Recupero ${ex.rest}"</div>
          ${deloadTag}
        </div>
        <div class="btnrow">
          <button class="notebtn ${hasNote?'has':''}" data-note="${exIdx}">✎</button>
          <button class="infobtn" data-info="${exIdx}">i</button>
        </div>
      </div>
      <div class="setsrow">${setBtns}</div>
      <div class="weightrow">
        <label>Carico</label>
        <input type="number" inputmode="decimal" placeholder="kg" data-weight="${exIdx}" value="${curVal}">
        <div class="prev">${prevVal}</div>
      </div>
      ${hasNote ? `<div class="note-preview show">📝 ${getNote(exIdx)}</div>` : ""}
    </div>`;
  });

  main.innerHTML = html;

  bindSession();
  main.querySelectorAll("[data-skip-ex]").forEach(btn=>btn.onclick=()=>{
    ensureSession();const i=btn.dataset.skipEx;const skipped=getSkipped();skipped[i]=!skipped[i];
    localStorage.setItem(skippedKey(),JSON.stringify(skipped));syncSession();renderWorkout();
    main.querySelector(".exercise-next")?.scrollIntoView({behavior:"smooth",block:"start"});
  });
  main.querySelectorAll(".setbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      ensureSession();
      const exIdx = btn.dataset.ex, s = btn.dataset.set, rest = parseInt(btn.dataset.rest,10);
      const k = `e${exIdx}_s${s}`;
      const cur = getChecked();
      const nowDone = !cur[k];
      cur[k] = nowDone;
      setChecked(cur);
      const skipped=getSkipped();delete skipped[exIdx];localStorage.setItem(skippedKey(),JSON.stringify(skipped));
      syncSession();
      renderWorkout();
      const exercise = day.exercises[exIdx];
      const count = exercise.sets - (state.week%4===0 && exercise.compound && exercise.sets>1 ? 1 : 0);
      if(nowDone && Array.from({length:count}, (_,i)=>!!cur[`e${exIdx}_s${i}`]).every(Boolean)){
        main.querySelector(".exercise-next")?.scrollIntoView({behavior:"smooth", block:"start"});
      }
      if(nowDone && rest > 0){ startTimer(rest, DAYS[state.dayIdx].exercises[exIdx].name); }
    });
  });

  main.querySelectorAll("[data-weight]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      localStorage.setItem(weightKey(inp.dataset.weight), inp.value);
      syncSession();
    });
  });

  main.querySelectorAll("[data-info]").forEach(btn=>{
    btn.addEventListener("click", ()=> openInfo(day.exercises[btn.dataset.info]));
  });

  main.querySelectorAll("[data-note]").forEach(btn=>{
    btn.addEventListener("click", ()=> openNote(parseInt(btn.dataset.note,10)));
  });
}

/* ===================== TIMER (robusto in background) ===================== */
const timerBg = document.getElementById("timerBg");
const timerNum = document.getElementById("timerNum");
const timerSub = document.getElementById("timerSub");
let timerEndAt = null;      // timestamp assoluto di fine
let timerInterval = null;
let timerExName = "";
let wakeLock = null;
let audioCtx = null;

function unlockAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
}
// Sblocca l'audio al primo tocco (richiesto da iOS Safari)
document.addEventListener("touchend", unlockAudio, { once:true });
document.addEventListener("click", unlockAudio, { once:true });

function playBeep(){
  try{
    unlockAudio();
    if(!audioCtx) return;
    for(let i=0;i<3;i++){
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.value = 0.25;
      o.connect(g); g.connect(audioCtx.destination);
      const start = audioCtx.currentTime + i*0.35;
      o.start(start);
      g.gain.setValueAtTime(0.25, start);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
      o.stop(start + 0.32);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,80,200,80,200]);
}

async function requestWakeLockOn(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){ /* non disponibile: iOS < 16.4 o permesso negato, si ignora */ }
}
function releaseWakeLock(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && timerEndAt){ requestWakeLockOn(); tickTimer(); }
});

function startTimer(seconds, exName){
  timerExName = exName;
  timerEndAt = Date.now() + seconds*1000;
  timerBg.classList.add("show");
  timerSub.textContent = exName;
  requestWakeLockOn();
  if(timerInterval) clearInterval(timerInterval);
  tickTimer();
  timerInterval = setInterval(tickTimer, 250);
}

function tickTimer(){
  if(!timerEndAt) return;
  const remainMs = timerEndAt - Date.now();
  const remain = Math.max(0, Math.round(remainMs/1000));
  timerNum.textContent = remain;
  if(remain <= 0){
    clearInterval(timerInterval);
    timerInterval = null;
    playBeep();
    timerSub.textContent = "Recupero terminato — pronto per la prossima serie";
    setTimeout(()=>{ closeTimer(); }, 1400);
  }
}

function closeTimer(){
  timerBg.classList.remove("show");
  timerEndAt = null;
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  releaseWakeLock();
}

document.getElementById("timerSkip").addEventListener("click", closeTimer);
document.getElementById("timerPlus").addEventListener("click", ()=>{ if(timerEndAt){ timerEndAt += 15000; tickTimer(); }});
document.getElementById("timerMinus").addEventListener("click", ()=>{ if(timerEndAt){ timerEndAt -= 15000; tickTimer(); }});

window.finishLaunch();

// Blocca doppio-tap zoom residuo e gesture di pinch
document.addEventListener("gesturestart", (e)=> e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener("touchend", (e)=>{
  const now = Date.now();
  if(now - lastTouchEnd <= 300){ e.preventDefault(); }
  lastTouchEnd = now;
}, { passive:false });
</script>
</body>
</html>
